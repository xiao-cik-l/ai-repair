{% extends "base.html" %}

{% block content %}
<div class="panel narrow">
    <h2>学生注册</h2>

    <form action="{{ url_for('student_register') }}" method="post" class="form-card" id="registerForm">
        <label>
            姓名
            <input type="text" name="name" placeholder="请输入姓名" required>
        </label>

        <label>
            学号
            <input type="text" name="student_no" id="student_no" placeholder="格式：js23150301" required
                   pattern="^js\d{8}$" title="学号格式：js开头加八位数字，例如：js23150301">
        </label>

        <label>
            邮箱
            <input type="email" name="email" id="reg_email" placeholder="请输入邮箱" required>
        </label>

        <label>
            密码
            <input type="password" name="password" placeholder="不少于6位" required>
        </label>

        <label>
            邮箱验证码
            <div class="inline-form">
                <input type="text" name="code" placeholder="6位验证码" required>
                <button type="button" id="sendCodeBtn" onclick="sendRegisterCode()">发送验证码</button>
            </div>
        </label>

        <button type="submit">完成注册</button>
    </form>
</div>

<script>
function sendRegisterCode() {
    const email = document.getElementById('reg_email').value;
    sendCodeAjax(email, 'register', 'sendCodeBtn');
}
</script>
{% endblock %}
